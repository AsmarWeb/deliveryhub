services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deliveryhub-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - deliveryhub

  nginx:
    image: nginx:1.27-alpine
    container_name: deliveryhub-nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - deliveryhub

  mysql:
    image: mysql:8.4
    container_name: deliveryhub-mysql
    environment:
      MYSQL_DATABASE: deliveryhub
      MYSQL_USER: deliveryhub
      MYSQL_PASSWORD: deliveryhub
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - deliveryhub

  redis:
    image: redis:7-alpine
    container_name: deliveryhub-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - deliveryhub

volumes:
  mysql_data:
  redis_data:

networks:
  deliveryhub:
